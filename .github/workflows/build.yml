name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  simcore-tests:
    name: Simulation tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Run SimCore tests
        working-directory: Packages/SimCore
        run: swift test

  ios-build:
    name: iOS app build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app for iPhone
        run: |
          set -o pipefail
          xcodebuild \
            -project TruckSim.xcodeproj \
            -scheme TruckSim \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TruckSim.app Payload/
          zip -qr TruckSim-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: TruckSim-unsigned-ipa
          path: TruckSim-unsigned.ipa


  testflight:
    # Backup route to TestFlight for when Codemagic credits run out.
    # Only runs when started by hand: Actions tab, Build, Run workflow. See docs/GITHUB_TESTFLIGHT.md.
    name: Upload to TestFlight (backup)
    needs: [simcore-tests, ios-build]
    runs-on: macos-15
    if: github.event_name == 'workflow_dispatch'
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # The key comes from the private iOS-certificates repo (AuthKey_<KEY ID>.p8), read with this token.
      # (ASC_KEY_ID and ASC_KEY_P8 secrets still work instead, if set.)
      CERTS_REPO_TOKEN: ${{ secrets.CERTS_REPO_TOKEN }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check that signing secrets are set
        run: |
          missing=""
          for v in TEAM_ID ASC_ISSUER_ID; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -z "$CERTS_REPO_TOKEN" ] && [ -z "$ASC_KEY_P8" ]; then missing="$missing CERTS_REPO_TOKEN"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see docs/GITHUB_TESTFLIGHT.md)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Get the App Store Connect key from iOS-certificates
        if: env.CERTS_REPO_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: belgarath534/iOS-certificates
          token: ${{ secrets.CERTS_REPO_TOKEN }}
          path: .certs
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Write App Store Connect key
        run: |
          if [ -n "$ASC_KEY_P8" ]; then
            KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
            printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          else
            # The key named by ASC_KEY_ID if set, otherwise the first key in the repo; its ID is in the file name.
            if [ -n "$ASC_KEY_ID" ]; then SRC=".certs/AuthKey_${ASC_KEY_ID}.p8"; else SRC=$(ls .certs/AuthKey_*.p8 | head -1); fi
            [ -f "$SRC" ] || { echo "::error::No AuthKey_*.p8 found in iOS-certificates"; exit 1; }
            ASC_KEY_ID=$(basename "$SRC" .p8 | sed 's/^AuthKey_//')
            echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
            KEY_PATH="$RUNNER_TEMP/$(basename "$SRC")"
            cp "$SRC" "$KEY_PATH"
            # Keep every key: cloud signing needs an Admin key, so the upload tries each one.
            mkdir -p "$RUNNER_TEMP/keys"
            cp .certs/AuthKey_*.p8 "$RUNNER_TEMP/keys/"
          fi
          rm -rf .certs
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "Using App Store Connect key $ASC_KEY_ID"
      - name: Sign on this Mac with a temporary certificate, and upload
        # Works with a non-Admin (App Manager) key: a temporary Apple Distribution certificate and App Store
        # profile are made for this build and deleted afterwards (apps already uploaded keep working).
        env:
          BUNDLE_ID: com.accessibletrucksim.TruckSim
        run: |
          set -e
          pip3 install --quiet --break-system-packages codemagic-cli-tools 2>/dev/null || pip3 install --quiet codemagic-cli-tools
          export APP_STORE_CONNECT_ISSUER_ID="$ASC_ISSUER_ID"
          export APP_STORE_CONNECT_KEY_IDENTIFIER="$ASC_KEY_ID"
          export APP_STORE_CONNECT_PRIVATE_KEY="@file:$KEY_PATH"
          W="$RUNNER_TEMP/signing"; mkdir -p "$W"
          echo "W=$W" >> "$GITHUB_ENV"

          sed -i '' "s/CURRENT_PROJECT_VERSION: \"[0-9]*\"/CURRENT_PROJECT_VERSION: \"$((10000 + ${{ github.run_number }}))\"/" project.yml
          xcodegen generate

          keychain initialize
          openssl genrsa -out "$W/cert_key.pem" 2048
          CERT_ID=$(app-store-connect certificates create --type DISTRIBUTION --certificate-key "@file:$W/cert_key.pem" \
            --save --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "$CERT_ID" > "$W/cert_id"
          echo "Temporary certificate $CERT_ID"
          keychain add-certificates

          BID=$(app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --platform IOS --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d[0]["id"])')
          PROFILE_ID=$(app-store-connect profiles create "$BID" --type IOS_APP_STORE --certificate-ids "$CERT_ID" \
            --name "Truck Sim GitHub ${{ github.run_number }}" --save --profiles-dir "$W/profiles" --json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "$PROFILE_ID" > "$W/profile_id"
          echo "Temporary profile $PROFILE_ID"

          # Install the profile where Xcode looks for it (Xcode 16 uses the UserData folder, older Xcode the other).
          for D in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$D"
            for P in "$W"/profiles/*.mobileprovision; do cp "$P" "$D/$(basename "$P")"; done
          done
          xcode-project use-profiles --project TruckSim.xcodeproj --profile "$W/profiles/*.mobileprovision"
          if ! xcode-project build-ipa --project TruckSim.xcodeproj --scheme TruckSim --ipa-directory "$W/ipa"; then
            echo "::group::Xcode errors"
            grep -h -E "error:|Signing for|requires a development team|provisioning profile|entitlement" /tmp/xcodebuild_logs/*.log 2>/dev/null | sort -u | head -40 || true
            echo "::endgroup::"
            exit 1
          fi
          app-store-connect publish --path "$W/ipa/*.ipa"
      - name: Delete the temporary certificate and profile
        if: always()
        run: |
          export APP_STORE_CONNECT_ISSUER_ID="$ASC_ISSUER_ID"
          export APP_STORE_CONNECT_KEY_IDENTIFIER="$ASC_KEY_ID"
          export APP_STORE_CONNECT_PRIVATE_KEY="@file:$KEY_PATH"
          if [ -f "$W/profile_id" ]; then app-store-connect profiles delete "$(cat "$W/profile_id")" --ignore-not-found || true; fi
          if [ -f "$W/cert_id" ]; then app-store-connect certificates delete "$(cat "$W/cert_id")" --ignore-not-found || true; fi
          rm -rf "$W"
      - name: Remove key
        if: always()
        run: rm -rf "$KEY_PATH" "$RUNNER_TEMP/keys"
