name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  simcore-tests:
    name: Simulation tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Run SimCore tests
        working-directory: Packages/SimCore
        run: swift test

  ios-build:
    name: iOS app build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app for iPhone
        run: |
          set -o pipefail
          xcodebuild \
            -project TruckSim.xcodeproj \
            -scheme TruckSim \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TruckSim.app Payload/
          zip -qr TruckSim-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: TruckSim-unsigned-ipa
          path: TruckSim-unsigned.ipa


  testflight:
    # Backup route to TestFlight for when Codemagic credits run out: fastlane match, the same way as the RPG game.
    # Only runs when started by hand: Actions tab, Build, Run workflow. See docs/GITHUB_TESTFLIGHT.md.
    name: Upload to TestFlight (backup)
    needs: [simcore-tests, ios-build]
    runs-on: macos-15
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch'
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      CERTS_REPO_TOKEN: ${{ secrets.CERTS_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=0
          for name in MATCH_PASSWORD CERTS_REPO_TOKEN ASC_ISSUER_ID; do
            if [ -n "${!name}" ]; then echo "✅ $name is set"; else echo "❌ $name is missing"; missing=1; fi
          done
          CLEAN=$(printf '%s' "$CERTS_REPO_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN"
          echo "CLEAN_CERTS_TOKEN=$CLEAN" >> "$GITHUB_ENV"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLEAN" https://api.github.com/repos/belgarath534/ios-certificates)
          if [ "$CODE" = "200" ]; then echo "✅ Token can reach ios-certificates"; else echo "❌ Token can't reach ios-certificates (HTTP $CODE)"; missing=1; fi
          exit $missing

      - name: Get key files from ios-certificates
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: belgarath534/ios-certificates
          token: ${{ env.CLEAN_CERTS_TOKEN }}
          path: .certs-repo

      - name: Collect Apple API keys
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.asc/candidates"
          if [ -d .certs-repo ]; then
            find .certs-repo -name '*.p8' -not -path '*/.git/*' -exec cp {} "$HOME/.asc/candidates/" \;
          fi
          if [ -n "$ASC_KEY_P8" ] && [ -n "$ASC_KEY_ID" ]; then
            printf '%s\n' "$ASC_KEY_P8" > "$HOME/.asc/candidates/secret_$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]').p8"
          fi
          rm -rf .certs-repo
          echo "Keys found: $(ls "$HOME/.asc/candidates" | tr '\n' ' ')"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Find the key Apple accepts
        run: ruby scripts/check_asc_key.rb

      # Apple only accepts apps built with the newest SDK, so use the newest Xcode on the runner.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build, sign and upload to TestFlight
        run: bundle exec fastlane beta

      - name: Remove keys
        if: always()
        run: rm -rf "$HOME/.asc"
