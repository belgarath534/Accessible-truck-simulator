name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  simcore-tests:
    name: Simulation tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Run SimCore tests
        working-directory: Packages/SimCore
        run: swift test

  ios-build:
    name: iOS app build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app for iPhone
        run: |
          set -o pipefail
          xcodebuild \
            -project TruckSim.xcodeproj \
            -scheme TruckSim \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TruckSim.app Payload/
          zip -qr TruckSim-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: TruckSim-unsigned-ipa
          path: TruckSim-unsigned.ipa


  testflight:
    # Backup route to TestFlight for when Codemagic credits run out.
    # Only runs when started by hand: Actions tab, Build, Run workflow. See docs/GITHUB_TESTFLIGHT.md.
    name: Upload to TestFlight (backup)
    needs: [simcore-tests, ios-build]
    runs-on: macos-15
    if: github.event_name == 'workflow_dispatch'
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # The key comes from the private iOS-certificates repo (AuthKey_<KEY ID>.p8), read with this token.
      # (ASC_KEY_ID and ASC_KEY_P8 secrets still work instead, if set.)
      CERTS_REPO_TOKEN: ${{ secrets.CERTS_REPO_TOKEN }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check that signing secrets are set
        run: |
          missing=""
          for v in TEAM_ID ASC_ISSUER_ID; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -z "$CERTS_REPO_TOKEN" ] && [ -z "$ASC_KEY_P8" ]; then missing="$missing CERTS_REPO_TOKEN"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see docs/GITHUB_TESTFLIGHT.md)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Get the App Store Connect key from iOS-certificates
        if: env.CERTS_REPO_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: belgarath534/iOS-certificates
          token: ${{ secrets.CERTS_REPO_TOKEN }}
          path: .certs
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Write App Store Connect key
        run: |
          if [ -n "$ASC_KEY_P8" ]; then
            KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
            printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          else
            # The key named by ASC_KEY_ID if set, otherwise the first key in the repo; its ID is in the file name.
            if [ -n "$ASC_KEY_ID" ]; then SRC=".certs/AuthKey_${ASC_KEY_ID}.p8"; else SRC=$(ls .certs/AuthKey_*.p8 | head -1); fi
            [ -f "$SRC" ] || { echo "::error::No AuthKey_*.p8 found in iOS-certificates"; exit 1; }
            ASC_KEY_ID=$(basename "$SRC" .p8 | sed 's/^AuthKey_//')
            echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
            KEY_PATH="$RUNNER_TEMP/$(basename "$SRC")"
            cp "$SRC" "$KEY_PATH"
          fi
          rm -rf .certs
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "Using App Store Connect key $ASC_KEY_ID"
      - name: Archive (cloud-managed signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project TruckSim.xcodeproj \
            -scheme TruckSim \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TruckSim.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$((10000 + ${{ github.run_number }}))" \
            archive
      - name: Export and upload to App Store Connect
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TruckSim.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove key
        if: always()
        run: rm -f "$KEY_PATH"
