name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  simcore-tests:
    name: Simulation tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Run SimCore tests
        working-directory: Packages/SimCore
        run: swift test

  ios-build:
    name: iOS app build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app for iPhone
        run: |
          set -o pipefail
          xcodebuild \
            -project TruckSim.xcodeproj \
            -scheme TruckSim \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TruckSim.app Payload/
          zip -qr TruckSim-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: TruckSim-unsigned-ipa
          path: TruckSim-unsigned.ipa

