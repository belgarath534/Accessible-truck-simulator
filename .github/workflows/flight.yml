name: Flight Sim

# The flight sim lives in FlightGame/ and uses the same secrets and certificates as the truck sim.
on:
  push:
    paths: ["FlightGame/**", ".github/workflows/flight.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: FlightGame

jobs:
  flightcore-tests:
    name: Flight Sim tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Run FlightCore tests
        working-directory: FlightGame/Packages/FlightCore
        run: swift test

  ios-build:
    name: Flight Sim iOS build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned app for iPhone
        run: |
          set -o pipefail
          xcodebuild \
            -project FlightSim.xcodeproj \
            -scheme FlightSim \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

  testflight:
    # Only when started by hand: Actions tab, Flight Sim, Run workflow.
    name: Upload Flight Sim to TestFlight
    needs: [flightcore-tests, ios-build]
    runs-on: macos-15
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch'
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      CERTS_REPO_TOKEN: ${{ secrets.CERTS_REPO_TOKEN }}
      BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=0
          for name in MATCH_PASSWORD CERTS_REPO_TOKEN ASC_ISSUER_ID; do
            if [ -n "${!name}" ]; then echo "✅ $name is set"; else echo "❌ $name is missing"; missing=1; fi
          done
          CLEAN=$(printf '%s' "$CERTS_REPO_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN"
          echo "CLEAN_CERTS_TOKEN=$CLEAN" >> "$GITHUB_ENV"
          exit $missing

      - name: Get key files from ios-certificates
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: belgarath534/ios-certificates
          token: ${{ env.CLEAN_CERTS_TOKEN }}
          path: .certs-repo

      - name: Collect Apple API keys
        working-directory: .
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.asc/candidates"
          if [ -d .certs-repo ]; then
            find .certs-repo -name '*.p8' -not -path '*/.git/*' -exec cp {} "$HOME/.asc/candidates/" \;
          fi
          if [ -n "$ASC_KEY_P8" ] && [ -n "$ASC_KEY_ID" ]; then
            printf '%s\n' "$ASC_KEY_P8" > "$HOME/.asc/candidates/secret_$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]').p8"
          fi
          rm -rf .certs-repo
          echo "Keys found: $(ls "$HOME/.asc/candidates" | tr '\n' ' ')"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Find the key Apple accepts
        working-directory: .
        run: ruby scripts/check_asc_key.rb

      - name: Fill in TestFlight information (description, feedback email, review contact and notes, testers)
        continue-on-error: true
        working-directory: .
        env:
          STORE_BUNDLE: com.accessibleflightsim.FlightSim
          STORE_TEXT_DIR: FlightGame/store/en-US
          STORE_PRIVACY_URL: https://github.com/belgarath534/Accessible-truck-simulator/blob/HEAD/FlightGame/PRIVACY.md
          STORE_MARKETING_URL: https://github.com/belgarath534/Accessible-truck-simulator/tree/HEAD/FlightGame
          STORE_ONLY_TESTFLIGHT: "1"
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography requests || python3 -m pip install --quiet pyjwt cryptography requests
          APP_STORE_CONNECT_PRIVATE_KEY="@file:$ASC_KEY_PATH" APP_STORE_CONNECT_KEY_IDENTIFIER="$GOOD_KEY_ID" \
          APP_STORE_CONNECT_ISSUER_ID="$ASC_ISSUER_ID" python3 store/fill_store_info.py

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build, sign and upload to TestFlight
        run: bundle exec fastlane beta

      - name: Remove keys
        if: always()
        working-directory: .
        run: rm -rf "$HOME/.asc"
