# Accessible Truck Simulator on Codemagic, set up the same way as Dungeon Descent:
# same App Store Connect key ("Accessible Backrooms") and same distribution certificate.
# Start builds by hand in Codemagic. Every successful build goes to TestFlight.
workflows:
  truck-sim-testflight:
    name: Truck Sim TestFlight
    # The 45 minute cap keeps a stuck build from using up build minutes (a normal build is a few minutes).
    # mac_mini_m4 is not available on the current Codemagic plan.
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Accessible Backrooms
    environment:
      ios_signing:
        # Codemagic insists on at least one saved profile here before it will load the certificate.
        # This one belongs to Dungeon Descent's Live Activity (a different bundle ID), so it is never
        # used for Truck Sim; Truck Sim's own profile comes from Apple in the step below.
        provisioning_profiles:
          - Dungeon Descent Live Activity App Store
        certificates:
          - Accessible Backrooms Distribution
      vars:
        BUNDLE_ID: com.accessibletrucksim.TruckSim
        # The profile name changes when the app needs a new capability, so a fresh profile is made.
        PROFILE_NAME: Truck Sim App Store Game Center
      xcode: 27.1  # same as The Last Signal; "latest" is not available on this plan
    scripts:
      - name: Run the driving simulation tests
        script: |
          cd Packages/SimCore
          swift test
      - name: Set build number and make the Xcode project
        script: |
          set -e
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"[0-9]*\"/CURRENT_PROJECT_VERSION: \"$BUILD_NUMBER\"/" project.yml
          grep CURRENT_PROJECT_VERSION project.yml
          brew install xcodegen
          xcodegen generate
      - name: Get the App Store profile from Apple
        script: |
          # Uses the App Store Connect key from the integration above.
          # Registers the bundle ID and creates the profile the first time; reuses them after that.
          set -e
          DEST="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DEST"

          BID=$(app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --platform IOS --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d[0]["id"] if d else "")')
          if [ -z "$BID" ]; then
            echo "Registering bundle ID $BUNDLE_ID with Apple"
            BID=$(app-store-connect bundle-ids create "$BUNDLE_ID" --name "Truck Sim" --platform IOS --json \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          fi
          echo "Bundle ID resource: $BID"

          TMP=$(mktemp -d)
          app-store-connect profiles list --type IOS_APP_STORE --state ACTIVE --name "$PROFILE_NAME" --save --profiles-dir "$TMP" || true
          if ls "$TMP"/*.mobileprovision >/dev/null 2>&1; then
            echo "Using the existing \"$PROFILE_NAME\" profile"
            cp "$TMP"/*.mobileprovision "$DEST/"
            exit 0
          fi

          # A new profile is needed. Make sure the app ID has Game Center first (changing capabilities makes old
          # profiles invalid, so this only happens here, never when a good profile already exists).
          app-store-connect bundle-ids enable-capabilities "$BID" --capability "Game Center" || echo "Game Center capability: could not turn it on (it may already be on)"
          # Remove invalid profiles with the same name, or Apple refuses to make a new one.
          app-store-connect profiles list --name "$PROFILE_NAME" --json | python3 -c '
          import json, sys
          for p in json.load(sys.stdin):
              state = (p.get("attributes") or p).get("profileState", "")
              if state != "ACTIVE":
                  print(p["id"])
          ' | while read -r OLD; do
            echo "Deleting invalid profile $OLD"
            app-store-connect profiles delete "$OLD" || true
          done

          # Find the Apple certificate that matches the distribution certificate Codemagic put in the keychain.
          PEM=$(security find-certificate -a -c "Apple Distribution" -p || true)
          [ -n "$PEM" ] || PEM=$(security find-certificate -a -c "iPhone Distribution" -p)
          SERIAL=$(echo "$PEM" | openssl x509 -noout -serial | cut -d= -f2)
          echo "Distribution certificate serial: $SERIAL"
          CERT_ID=""
          for TYPE in DISTRIBUTION IOS_DISTRIBUTION; do
            CERT_ID=$(app-store-connect certificates list --type $TYPE --json | SERIAL="$SERIAL" python3 -c '
          import json, os, sys
          want = os.environ["SERIAL"].upper().lstrip("0")
          for c in json.load(sys.stdin):
              serial = (c.get("attributes") or c).get("serialNumber", "")
              if serial.upper().lstrip("0") == want:
                  print(c["id"]); break
          ')
            [ -n "$CERT_ID" ] && break
          done
          if [ -z "$CERT_ID" ]; then
            echo "Could not find the Accessible Backrooms Distribution certificate on Apple"
            exit 1
          fi

          echo "Creating the \"$PROFILE_NAME\" profile"
          app-store-connect profiles create "$BID" --type IOS_APP_STORE --certificate-ids "$CERT_ID" \
            --name "$PROFILE_NAME" --save --profiles-dir "$DEST"
      - name: Fill in App Store Connect info (TestFlight text, listing, review notes)
        script: |
          # Never fails the build: problems are listed in this step's log instead.
          python3 -m pip install --quiet --user pyjwt cryptography requests
          python3 store/fill_store_info.py || echo "Store info step had a problem; see above"
      - name: Use the App Store signing profile
        script: |
          xcode-project use-profiles --project TruckSim.xcodeproj
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project TruckSim.xcodeproj \
            --scheme TruckSim
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false  # internal testers get every build anyway

  truck-sim-store-info:
    name: Truck Sim store info only
    # Quick run (no app build): fills in TestFlight and App Store text from store/en-US,
    # including "What to Test" on the newest builds. See store/fill_store_info.py.
    max_build_duration: 15
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Accessible Backrooms
    scripts:
      - name: Fill in App Store Connect info
        script: |
          python3 -m pip install --quiet --user pyjwt cryptography requests
          python3 store/fill_store_info.py

  truck-sim-game-center:
    name: Truck Sim Game Center setup
    # Creates the achievements and leaderboards in App Store Connect. See store/setup_game_center.py.
    max_build_duration: 15
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Accessible Backrooms
    scripts:
      - name: Achievements and leaderboards
        script: |
          python3 -m pip install --quiet --user pyjwt cryptography requests
          python3 store/setup_game_center.py

  truck-sim-submit:
    name: Truck Sim submit for App Review
    # Sets the price to free, makes the app available everywhere, attaches the newest build to the
    # version waiting for submission, and with SUBMIT=yes sends it to App Review. See store/submit_for_review.py.
    max_build_duration: 15
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Accessible Backrooms
    scripts:
      - name: Price, availability, build and submit
        script: |
          python3 -m pip install --quiet --user pyjwt cryptography requests
          python3 store/submit_for_review.py

  truck-sim-screenshots:
    name: Truck Sim App Store screenshots
    # Runs the game in the largest iPhone simulator in screenshot mode and saves five screenshots as
    # artifacts. With UPLOAD=yes it also puts them on the App Store version (replacing what's there).
    max_build_duration: 40
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Accessible Backrooms
    environment:
      xcode: 27.1
    scripts:
      - name: Build for the simulator
        script: |
          set -e
          brew install xcodegen
          xcodegen generate
          xcodebuild -project TruckSim.xcodeproj -scheme TruckSim -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -5
      - name: Take screenshots
        script: |
          set -e
          # shoot KIND PATTERN: picks the newest iOS that has a device whose name contains PATTERN
          # (the biggest iPhone or iPad Apple asks for), and takes the five screenshots into shots/KIND.
          shoot() {
            KIND=$1; PATTERN=$2
            read RUNTIME TYPE <<< "$(PATTERN="$PATTERN" xcrun simctl list runtimes -j | PATTERN="$PATTERN" python3 -c '
          import json, os, re, sys
          want = os.environ["PATTERN"]
          rts = [r for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS" and r["isAvailable"]]
          def num(t):
              m = re.findall(r"\d+", t["name"])
              return [int(x) for x in m]
          for rt in reversed(rts):
              found = [t for t in rt.get("supportedDeviceTypes", []) if want in t["name"]]
              if found:
                  print(rt["identifier"], max(found, key=num)["identifier"]); break')"
            echo "=== $KIND: device $TYPE on $RUNTIME"
            UDID=$(xcrun simctl create "Screenshots $KIND" "$TYPE" "$RUNTIME")
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
            xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/TruckSim.app
            mkdir -p "shots/$KIND"
            n=1
            for SCREEN in drive jobs garage company menu; do
              xcrun simctl launch --terminate-running-process "$UDID" com.accessibletrucksim.TruckSim -screenshot $SCREEN
              if [ "$SCREEN" = "drive" ]; then sleep 25; else sleep 6; fi
              xcrun simctl io "$UDID" screenshot "shots/$KIND/raw_${n}_${SCREEN}.png"
              n=$((n+1))
            done
            xcrun simctl shutdown "$UDID" || true
            # The app is landscape-only; the simulator captures the portrait framebuffer. Turn each picture.
            for f in shots/$KIND/raw_*.png; do
              out="shots/$KIND/$(basename "$f" | sed 's/raw_//')"
              w=$(sips -g pixelWidth "$f" | awk '/pixelWidth/{print $2}')
              h=$(sips -g pixelHeight "$f" | awk '/pixelHeight/{print $2}')
              if [ "$h" -gt "$w" ]; then sips -r ${ROTATE:-270} "$f" --out "$out" >/dev/null; else cp "$f" "$out"; fi
              sips -g pixelWidth -g pixelHeight "$out" | tail -2
            done
            rm shots/$KIND/raw_*.png
          }
          shoot iphone "Pro Max"
          shoot ipad "iPad Pro 13"
          # If the app crashed, show why.
          for r in ~/Library/Logs/DiagnosticReports/TruckSim*; do
            [ -f "$r" ] || continue
            echo "=== Crash report $r"; head -c 6000 "$r"; cp "$r" shots/ || true
          done
      - name: Upload to App Store Connect
        script: |
          if [ "$UPLOAD" = "yes" ]; then
            python3 -m pip install --quiet --user pyjwt cryptography requests
            python3 store/upload_screenshots.py shots/iphone APP_IPHONE_67
            python3 store/upload_screenshots.py shots/ipad APP_IPAD_PRO_3GEN_129
          else
            echo "Not uploading (UPLOAD is not yes). Check the artifacts first."
          fi
    artifacts:
      - shots/*/*.png
      - shots/*.ips
