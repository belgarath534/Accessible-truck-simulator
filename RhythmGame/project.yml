# Beat by Ear. The .xcodeproj is generated from this by XcodeGen (on GitHub's Mac runners).
name: BeatByEar
options:
  bundleIdPrefix: com.beatbyear
  deploymentTarget:
    iOS: "17.0"
packages:
  BeatCore:
    path: Packages/BeatCore
targets:
  BeatByEar:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: BeatCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Beat by Ear
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beatbyear.BeatByEar
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}
