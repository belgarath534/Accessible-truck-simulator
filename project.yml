# Xcode project definition. The .xcodeproj is generated from this by XcodeGen
# (on GitHub's Mac runners, or locally with `brew install xcodegen && xcodegen`).
name: TruckSim
options:
  bundleIdPrefix: com.accessibletrucksim
  deploymentTarget:
    iOS: "17.0"
packages:
  SimCore:
    path: Packages/SimCore
targets:
  TruckSim:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: SimCore
    entitlements:
      path: App/TruckSim.entitlements
      properties:
        com.apple.developer.game-center: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Truck Sim
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.accessibletrucksim.TruckSim
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Audio settings are shared with the real-time audio thread on purpose (a slightly stale value is
        # harmless); don't let runtime exclusivity checks stop the app over it.
        OTHER_SWIFT_FLAGS: "-enforce-exclusivity=unchecked"
    scheme: {}
